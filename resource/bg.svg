<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123329"/>
      <stop offset="0.5" stop-color="#1c5746"/>
      <stop offset="1" stop-color="#0a1210"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#7fd6b8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7fd6b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8d6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#bfe8d6" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <!-- 远山 -->
  <g filter="url(#soft)" fill="#2f7d5c" opacity="0.55">
    <path d="M0,640 L220,430 L420,610 L640,380 L860,600 L1060,420 L1280,610 L1480,470 L1600,590 L1600,1000 L0,1000 Z"/>
  </g>
  <g filter="url(#soft)" fill="#17493a" opacity="0.8">
    <path d="M0,760 L260,560 L500,740 L760,520 L1020,730 L1280,560 L1520,740 L1600,660 L1600,1000 L0,1000 Z"/>
  </g>
  <!-- 云气 -->
  <ellipse cx="420" cy="330" rx="420" ry="110" fill="url(#mist)"/>
  <ellipse cx="1180" cy="280" rx="460" ry="120" fill="url(#mist)"/>
  <ellipse cx="820" cy="520" rx="520" ry="90" fill="#0a1512" opacity="0.35"/>
  <ellipse cx="160" cy="620" rx="380" ry="80" fill="#0a1512" opacity="0.3"/>
  <!-- 山巅青光 -->
  <g filter="url(#soft)" fill="#5cc4a6" opacity="0.5">
    <ellipse cx="640" cy="420" rx="180" ry="46"/>
    <ellipse cx="1060" cy="470" rx="150" ry="38"/>
  </g>
</svg>
